rust-version = "1.85"
repository = "https://github.com/Rightbracket/peeroxide"
[dependencies]
peeroxide-dht = { path = "../peeroxide-dht" }
libudx = { version = "=1.7.3", path = "../libudx" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
rand = "0.9"
