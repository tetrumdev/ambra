<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:var(--font-sans,system-ui);color:var(--foreground,CanvasText)}body{margin:0}figure{margin:0}button{font:inherit;color:inherit;padding:5px 12px;border:1px solid var(--border,GrayText);border-radius:var(--radius,6px);background:transparent;cursor:pointer}button[aria-pressed=true]{background:var(--secondary,ButtonFace)}nav{display:flex;gap:8px;margin-bottom:12px}svg{display:block;width:100%;height:260px}svg text{font-size:12px;fill:var(--foreground,CanvasText)}.note{color:var(--muted-foreground,GrayText);font-size:12px;line-height:1.5}figcaption{font-size:14px;margin:8px 0}.legend{display:flex;gap:18px;font-size:13px}.before{color:var(--chart-1,SteelBlue)}.after{color:var(--chart-2,SeaGreen)}
</style></head><body><figure aria-label="Connection latency observations before and after HyperDHT fixes"><nav aria-label="Build profile"><button id="release" aria-pressed="true">Release</button><button id="debug" aria-pressed="false">Debug</button></nav><div class="legend"><span class="before">● Before</span><span class="after">● After</span><span>× Timeout</span></div><svg id="chart" viewBox="0 0 700 260" role="img" aria-label="Connection duration by round, logarithmic seconds"></svg><figcaption id="summary"></figcaption><div class="note">Public DHT signaling; direct data through same-router NAT hairpinning. Not independent cross-network traversal. Cold start is round 0; remaining rounds reuse each client's DHT node. Small samples; no cold-start or throughput improvement established. Hover points for observations.</div></figure><script>
const data={"release":{"before":[{"client":0,"connection_ms":4480.679625,"ok":true,"round":0,"throughput_mib_s":0.4288972793887331},{"client":0,"elapsed_ms":45002.517458,"error":"Err(Elapsed(()))","ok":false,"round":1},{"client":0,"connection_ms":1404.9890409999998,"ok":true,"round":2,"throughput_mib_s":0.4210881137931675},{"client":0,"elapsed_ms":45003.578916,"error":"Err(Elapsed(()))","ok":false,"round":3}],"after":[{"client":0,"connection_ms":5663.514833,"ok":true,"round":0,"throughput_mib_s":0.41240753855205003},{"client":0,"connection_ms":493.861125,"ok":true,"round":1,"throughput_mib_s":0.4035660644729117},{"client":0,"connection_ms":522.89325,"ok":true,"round":2,"throughput_mib_s":0.4380156642066794},{"client":0,"connection_ms":442.15970799999997,"ok":true,"round":3,"throughput_mib_s":0.4228798360583511},{"client":0,"connection_ms":509.789917,"ok":true,"round":4,"throughput_mib_s":0.42716799476161493},{"client":0,"connection_ms":452.56,"ok":true,"round":5,"throughput_mib_s":0.44190872709369067},{"client":0,"connection_ms":442.966792,"ok":true,"round":6,"throughput_mib_s":0.4535451984400876},{"client":0,"connection_ms":513.724667,"ok":true,"round":7,"throughput_mib_s":0.4336656093977169},{"client":0,"connection_ms":488.453208,"ok":true,"round":8,"throughput_mib_s":0.43348711830714176},{"client":0,"connection_ms":464.780042,"ok":true,"round":9,"throughput_mib_s":0.43768017840393797}]},"debug":{"before":[{"client":0,"connection_ms":10055.173084,"ok":true,"round":0,"throughput_mib_s":0.29310320106099924},{"client":0,"elapsed_ms":45001.95875,"error":"Err(Elapsed(()))","ok":false,"round":1},{"client":0,"connection_ms":5515.4505,"ok":true,"round":2,"throughput_mib_s":0.325664749430794},{"client":0,"elapsed_ms":45002.263167000005,"error":"Err(Elapsed(()))","ok":false,"round":3}],"after":[{"client":0,"connection_ms":7620.570666,"ok":true,"round":0,"throughput_mib_s":0.34004546237809263},{"client":0,"connection_ms":1014.8644170000001,"ok":true,"round":1,"throughput_mib_s":0.32986494543890227},{"client":0,"connection_ms":1081.1268750000002,"ok":true,"round":2,"throughput_mib_s":0.34007644705982126},{"client":0,"connection_ms":938.9896669999999,"ok":true,"round":3,"throughput_mib_s":0.32470654563138396},{"client":0,"connection_ms":916.666916,"ok":true,"round":4,"throughput_mib_s":0.3460632582927734},{"client":0,"connection_ms":952.806125,"ok":true,"round":5,"throughput_mib_s":0.27783221714851325},{"client":0,"connection_ms":931.088792,"ok":true,"round":6,"throughput_mib_s":0.3667747047406318},{"client":0,"connection_ms":967.047416,"ok":true,"round":7,"throughput_mib_s":0.33983307993821327},{"client":0,"connection_ms":933.375875,"ok":true,"round":8,"throughput_mib_s":0.34289929497761834},{"client":0,"connection_ms":921.440959,"ok":true,"round":9,"throughput_mib_s":0.3435448951787385}]}};
function render(profile){for(const p of ['release','debug'])document.getElementById(p).setAttribute('aria-pressed',String(p===profile));const d=data[profile],svg=document.getElementById('chart');const x=i=>62+i*66,y=ms=>216-(Math.log10(ms/100)/Math.log10(600))*188;let out='';for(const ms of [100,1000,10000,45000]){out+=`<line x1="62" y1="${y(ms)}" x2="664" y2="${y(ms)}" stroke="var(--border,GrayText)"/><text x="52" y="${y(ms)+4}" text-anchor="end">${ms/1000}s</text>`}for(let i=0;i<10;i++)out+=`<text x="${x(i)}" y="240" text-anchor="middle">${i}</text>`;for(const [phase,color] of [['before','var(--chart-1,SteelBlue)'],['after','var(--chart-2,SeaGreen)']]){const rows=d[phase];out+=`<polyline fill="none" stroke="${color}" stroke-width="2" opacity=".6" points="${rows.map(r=>`${x(r.round)},${y(r.ok?r.connection_ms:r.elapsed_ms)}`).join(' ')}"/>`;for(const r of rows){const px=x(r.round),py=y(r.ok?r.connection_ms:r.elapsed_ms),label=`${phase}, round ${r.round}: ${r.ok?(r.connection_ms/1000).toFixed(3)+' seconds':'45-second timeout'}`;out+=r.ok?`<circle cx="${px}" cy="${py}" r="4" fill="${color}"><title>${label}</title></circle>`:`<path d="M${px-5},${py-5}l10,10m-10,0l10,-10" stroke="var(--destructive,Crimson)" stroke-width="2"><title>${label}</title></path>`}}svg.innerHTML=out;document.getElementById('summary').textContent=`${profile==='release'?'Release':'Debug'}: ${d.before.filter(r=>r.ok).length}/${d.before.length} completed before; ${d.after.filter(r=>r.ok).length}/${d.after.length} after. Vertical axis: logarithmic seconds.`}
for(const p of ['release','debug'])document.getElementById(p).onclick=()=>render(p);render('release');
</script></body></html>
