build:
  name: Unsigned Ambra IPA for SideStore
  steps:
    - eas/checkout
    - eas/install_node_modules
    - run:
        name: Build native Rust networking
        command: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          bash scripts/build-network.sh ios
    - eas/prebuild
    - run:
        name: Install iOS dependencies
        working_directory: ios
        command: pod install
    - run:
        name: Archive and package unsigned iPhone app
        command: bash scripts/build-sidestore.sh
    - eas/upload_artifact:
        name: SideStore IPA
        inputs:
          type: application-archive
          path: mobile/.expo/sidestore/Ambra.ipa
