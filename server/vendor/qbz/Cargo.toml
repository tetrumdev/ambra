[workspace]
resolver = "2"
members = ["qbz-models", "qbz-cmaf", "qbz-qobuz"]

[workspace.package]
version = "2.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/volkertb/qbz"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls", "cookies", "stream", "gzip"] }
log = "0.4"
thiserror = "2"
anyhow = "1"
md-5 = "0.10"
base64 = "0.23"
chrono = "0.4"
regex = "1"
