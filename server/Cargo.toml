[package]
name = "ambra-server"
version = "0.2.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1"
futures-util = "0.3.33"
getrandom = "0.3"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
librespot-audio = "0.8.0"
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-protocol = "0.8.0"
protobuf = "3.7"
qbz-models = { path = "vendor/qbz/qbz-models" }
qbz-qobuz = { path = "vendor/qbz/qbz-qobuz" }
# Unify gzip into QBZ's reqwest 0.12 client; its defaults omit response compression.
# Keep this separate from Ambra's reqwest 0.13 streaming client.
qobuz-http = { package = "reqwest", version = "0.12", default-features = false, features = ["gzip"] }
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tidlers = "0.5.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# librespot 0.8's build helper is not compatible with vergen 9.1.
vergen = "=9.0.6"

[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
