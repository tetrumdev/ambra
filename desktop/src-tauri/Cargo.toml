[package]
name = "AMBRA"
version = "0.2.1"
description = "Ambra music player"
authors = ["Quantium Labs"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ambra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ambra-net = { path = "../../crates/ambra-net" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
if-addrs = "0.13"
tokio = { version = "1", features = ["time", "macros"] }
serde_json = "1"
sha2 = "0.10"
lofty = "0.24"
walkdir = "2"
base64 = "0.22"
oxideav-core = "0.1"
oxideav-flac = "0.0.11"
libc = "0.2"
souvlaki = { version = "0.8.3", path = "vendor/souvlaki" }
symphonia = { version = "0.6", features = ["all"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
biquad = "0.5"
fft-convolver = "0.4"
realfft = "3.5"
hound = "3.5"
ebur128 = "0.1.10"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
cocoa = "0.24.1"
objc = "0.2.7"
coreaudio-rs = "0.13"
objc2-core-audio = { version = "0.3", default-features = false, features = ["AudioHardwareDeprecated"] }

[patch.crates-io]
# Keep legacy Cocoa/media controls compatible with Rust's inhabited-static check.
block = { path = "vendor/block" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
axum = "0.8.9"
tokio-util = { version = "0.7", features = ["rt"] }
