name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - name: Reject sensitive files
        shell: bash
        run: ./scripts/check-sensitive-files.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            server
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        id: desktop-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles the app's updater verifies against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          # Update bundles need the signing key, so only release builds make them; latest.json lists them.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
          includeUpdaterJson: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: AMBRA v__VERSION__
          releaseBody: See the assets below to download AMBRA for macOS (.dmg) or Windows (.exe).
          releaseDraft: true
          prerelease: false

      - name: Verify desktop distribution excludes the server
        shell: bash
        run: python scripts/check-client-package.py desktop/src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Build independent server
        shell: bash
        run: cargo build --manifest-path server/Cargo.toml --locked --release --target ${{ matrix.target }}
      - name: Upload independent server
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.desktop-release.outputs.releaseId }}
        run: |
          suffix=""
          if [[ "${{ matrix.platform }}" == windows-* ]]; then suffix=".exe"; fi
          asset="ambra-server-${{ matrix.target }}$suffix"
          cp "server/target/${{ matrix.target }}/release/ambra-server$suffix" "$asset"
          gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset" --header "Content-Type: application/octet-stream" --input "$asset"
