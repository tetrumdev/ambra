name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build server sidecar
        shell: pwsh
        run: |
          cargo build --release --manifest-path ../server/Cargo.toml
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item ../server/target/release/ambra-server.exe src-tauri/binaries/ambra-server-x86_64-pc-windows-msvc.exe
      - run: bun run tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: AMBRA_0.1.1_windows_x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
