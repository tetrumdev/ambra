name: iOS SideStore IPA

# The same build as mobile/.eas/build/sidestore.yml, on GitHub's macOS runners: an unsigned
# IPA that SideStore signs on install. Started by hand (Actions tab or `gh workflow run`).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sidestore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: crates/ambra-net/tailcat/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/ambra-mobile-bridge
          key: ios
          cache-on-failure: true

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      # Each run gets a higher build number than the last (EAS builds reached 15).
      - name: Set build number
        working-directory: mobile
        run: |
          bun -e '
            const fs = require("node:fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.ios.buildNumber = String(100 + Number(process.env.GITHUB_RUN_NUMBER));
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("buildNumber", app.expo.ios.buildNumber);
          '

      - name: Build native Rust networking
        working-directory: mobile
        run: bash scripts/build-network.sh ios

      - name: Generate the iOS project
        working-directory: mobile
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Install iOS dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Archive and package unsigned iPhone app
        working-directory: mobile
        run: bash scripts/build-sidestore.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Ambra-ios-${{ github.run_number }}
          path: mobile/.expo/sidestore/Ambra.ipa
          if-no-files-found: error
          retention-days: 14
