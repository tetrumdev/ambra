[package]
name = "ambra-vault"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Encrypted, seekable storage for downloaded audio"

[dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

