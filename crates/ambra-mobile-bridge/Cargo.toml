[package]
name = "ambra-mobile-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
[lib]
name = "ambra_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
ambra-net = { path = "../ambra-net" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
